name: 버그 / 잘못된 판정
description: 오류가 나거나 판정 결과가 이상한 경우
title: "[버그] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **실제 방화벽 설정이나 분석 결과 화면을 그대로 올리지 마세요.** 공개 저장소입니다.
        문제를 재현할 때는 IP·이름을 가상 값으로 바꾼 정책 몇 줄이면 충분합니다.
  - type: dropdown
    id: where
    attributes:
      label: 사용 방식
      options:
        - 웹사이트 (kim-rookie.github.io)
        - Windows exe
        - 소스에서 실행 (python run.py)
    validations:
      required: true
  - type: input
    id: vendor
    attributes:
      label: 벤더 / 입력 형식
      placeholder: "예: FortiGate 설정 백업, 엑셀 export"
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요?
      description: 기대한 결과와 실제 결과, 오류 메시지를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현용 정책 (익명화)
      description: 가상 값으로 바꾼 정책 몇 줄
      render: text
  - type: checkboxes
    id: anonymized
    attributes:
      label: 확인
      options:
        - label: 올린 내용에 실제 IP, 회사·사람 이름, 내부 호스트명이 없습니다.
          required: true
