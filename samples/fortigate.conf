#config-version=FGT60F-7.2.5-FW-build1517:opmode=0:vdom=0:user=admin
config firewall address
    edit "all"
        set subnet 0.0.0.0 0.0.0.0
    next
    edit "WEB-NET"
        set subnet 10.10.1.0 255.255.255.0
    next
    edit "WEB-SRV"
        set subnet 10.10.1.10 255.255.255.255
    next
    edit "DB-SRV"
        set subnet 10.20.1.5 255.255.255.255
    next
    edit "OFFICE"
        set subnet 192.168.0.0 255.255.0.0
    next
    edit "OFFICE-RANGE"
        set type iprange
        set start-ip 192.168.10.1
        set end-ip 192.168.10.100
    next
    edit "VENDOR"
        set type fqdn
        set fqdn "vendor.example.com"
    next
end
config firewall addrgrp
    edit "WEB-GRP"
        set member "WEB-SRV"
    next
end
config firewall service custom
    edit "ALL"
        set protocol IP
    next
    edit "HTTP"
        set tcp-portrange 80
    next
    edit "HTTPS"
        set tcp-portrange 443
    next
    edit "SSH"
        set tcp-portrange 22
    next
    edit "MYSQL"
        set tcp-portrange 3306
    next
    edit "WEB-ALT"
        set tcp-portrange 8000-8999
    next
end
config firewall service group
    edit "WEB-SVC"
        set member "HTTP" "HTTPS"
    next
end
config firewall policy
    edit 10
        set name "office-web"
        set srcintf "internal"
        set dstintf "dmz"
        set action accept
        set srcaddr "OFFICE"
        set dstaddr "WEB-NET"
        set schedule "always"
        set service "WEB-SVC"
    next
    edit 11
        set name "office-range-https"
        set srcintf "internal"
        set dstintf "dmz"
        set action accept
        set srcaddr "OFFICE-RANGE"
        set dstaddr "WEB-SRV"
        set schedule "always"
        set service "HTTPS"
    next
    edit 12
        set name "office-ssh-deny"
        set srcintf "internal"
        set dstintf "dmz"
        set srcaddr "OFFICE"
        set dstaddr "WEB-NET"
        set schedule "always"
        set service "SSH"
    next
    edit 13
        set name "office-ssh-allow"
        set srcintf "internal"
        set dstintf "dmz"
        set action accept
        set srcaddr "OFFICE-RANGE"
        set dstaddr "WEB-GRP"
        set schedule "always"
        set service "SSH"
    next
    edit 14
        set name "web-db"
        set srcintf "dmz"
        set dstintf "db"
        set action accept
        set srcaddr "WEB-SRV"
        set dstaddr "DB-SRV"
        set schedule "always"
        set service "MYSQL"
    next
    edit 15
        set name "web-db-net"
        set srcintf "dmz"
        set dstintf "db"
        set action accept
        set srcaddr "WEB-NET"
        set dstaddr "DB-SRV"
        set schedule "always"
        set service "MYSQL"
    next
    edit 16
        set name "temp-disabled"
        set srcintf "internal"
        set dstintf "wan1"
        set action accept
        set status disable
        set srcaddr "all"
        set dstaddr "VENDOR"
        set schedule "always"
        set service "ALL"
    next
    edit 17
        set name "office-web-alt"
        set srcintf "internal"
        set dstintf "dmz"
        set action accept
        set srcaddr "OFFICE"
        set dstaddr "WEB-NET"
        set schedule "always"
        set service "WEB-ALT"
    next
    edit 18
        set name "internet"
        set srcintf "internal"
        set dstintf "wan1"
        set action accept
        set srcaddr "OFFICE"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
    next
end
